name: Fix Android version labels

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace API label with Android version label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/gameboost/ai/ui/screens/AllFeaturesScreens.kt')
          s = p.read_text()
          old = 'StatCard("API", "Android ${Build.VERSION.SDK_INT}", Modifier.weight(1f))'
          new = 'StatCard("ANDROID", "Android ${Build.VERSION.RELEASE}", Modifier.weight(1f))'
          if old in s:
              p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-android-label.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/gameboost/ai/ui/screens/AllFeaturesScreens.kt .github/workflows/fix-android-label.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix battery Android version label"
          git push
