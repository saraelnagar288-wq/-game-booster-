name: GameBoost AI 4.1 - APK Only

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: gameboost-ai-apk
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    name: Android 16 Native - Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify Android toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0' || true

      - name: Build GameBoost AI 4.1 Debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK verified: android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload GameBoost AI 4.1 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoost AI 4.1 Debug APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
