name: Game boost AI debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-android:
    name: Build Game boost AI debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify build tools
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0' || true

      - name: Build debug APK
        working-directory: android
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify real APK exists
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK verified: android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Game boost AI debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Game boost AI debug APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
