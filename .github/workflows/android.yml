name: GameBoost AI 4.1 - Unified APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: gameboost-ai-unified-apk
  cancel-in-progress: true

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

jobs:
  build-apk:
    name: Android 16 Native - Full APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Verify project and toolchain
        run: |
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          java -version
          gradle --version
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-36|build-tools;35.0.0' || true

      - name: Clean previous outputs
        working-directory: android
        run: gradle clean --stacktrace --no-daemon

      - name: Build all Android debug modules
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Verify GameBoost AI APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "GameBoost AI 4.1 APK verified"
          ls -lh "$APK"

      - name: Upload GameBoost AI 4.1 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GameBoost AI 4.1 Debug APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
